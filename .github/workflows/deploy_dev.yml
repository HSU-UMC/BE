name: UMC Dev CI/CD

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' || github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Make directory for deployment
        run: mkdir -p deploy

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Copy JAR file
        run: cp ./build/libs/*.jar ./deploy/

      # EC2로 프로젝트 파일을 복사하는 부분
      - name: Copy project files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_DEV_HOSTNAME }}
          username: ubuntu
          key: ${{ secrets.AWS_DEV_PRIVATE_KEY }}
          source: "./, !./.git, !./.github, !./.gitignore"  # Git 폴더를 제외한 모든 파일 복사
          target: "/home/ubuntu/app"  # EC2의 원하는 디렉토리로 복사

      - name: Build & Push Spring Boot Docker Image
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_REPOSITORY }}:backend .
          docker push ${{ secrets.DOCKER_REPOSITORY }}:backend

      - name: Build & Push Nginx Docker Image
        run: |
          docker build -f ./Dockerfile -t ${{ secrets.DOCKER_REPOSITORY }}:nginx .
          docker push ${{ secrets.DOCKER_REPOSITORY }}:nginx

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_DEV_HOSTNAME }}
          username: ubuntu
          key: ${{ secrets.AWS_DEV_PRIVATE_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{ secrets.DOCKER_REPOSITORY }}:backend
            docker pull ${{ secrets.DOCKER_REPOSITORY }}:nginx
            
            cd /home/ubuntu
            
            # nginx.conf 적용
            sudo cp /home/ubuntu/app/nginx/nginx.conf /etc/nginx/nginx.conf
            
            # 기존 컨테이너 중지 및 정리
            docker-compose down
            docker image prune -af
            
            # 새로운 컨테이너 실행
            cd /home/ubuntu/app
            docker-compose up -d
