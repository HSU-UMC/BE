name: UMC Dev CI/CD

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' || github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Make directory for deployment
        run: mkdir -p deploy

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Copy JAR file
        run: cp ./build/libs/*.jar ./deploy/

      - name: Build & Push Spring Boot Docker Image
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_REPOSITORY }}:backend .
          docker push ${{ secrets.DOCKER_REPOSITORY }}:backend

      - name: Build & Push Nginx Docker Image
        run: |
          docker build -f ./Dockerfile -t ${{ secrets.DOCKER_REPOSITORY }}:nginx .
          docker push ${{ secrets.DOCKER_REPOSITORY }}:nginx

      - name: Deploy to EC2 (Pull from GitHub)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_DEV_HOSTNAME }}
          username: ubuntu
          key: ${{ secrets.AWS_DEV_PRIVATE_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{ secrets.DOCKER_REPOSITORY }}:backend
            docker pull ${{ secrets.DOCKER_REPOSITORY }}:nginx

            # 최신 코드 가져오기
            cd /home/ubuntu
            if [ ! -d "app" ]; then
              git clone -b develop https://github.com/your-org/your-repo.git app
            else
              cd app
              git fetch origin
              git checkout develop
              git reset --hard origin/develop
              git pull origin develop
            fi

            # 최신 Nginx 설정 적용
            sudo cp /home/ubuntu/app/nginx/nginx.conf /etc/nginx/nginx.conf

            # 기존 컨테이너 중지 및 정리
            cd /home/ubuntu/app
            docker-compose down
            docker image prune -af

            # 최신 코드 기준으로 컨테이너 실행
            docker-compose up -d
